<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1320">
  <meta name="description" content="Mahmoud Ashraf Samak’s CV, LinkedIn profile, and infographic.">
  <title>Mahmoud Ashraf Samak</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a1320;
      color: #f5f8ff;
      --muted: #afbed1;
      --accent: #c7fc8c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 64px);
      background: radial-gradient(ellipse at 10% 0%, #182c45, transparent 67%), #0a1320;
    }

    main {
      width: min(100%, 940px);
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .95fr);
      border: 1px solid #34465c;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 32px 90px #03091280;
    }

    header {
      min-width: 0;
      min-height: 450px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 38px;
      padding: clamp(27px, 5vw, 50px);
      background: radial-gradient(ellipse at 20% 10%, #284463 0, transparent 72%), #16283f;
      border-right: 1px solid #34465c;
    }

    .monogram {
      position: relative;
      display: grid;
      place-items: center;
      width: 98px;
      aspect-ratio: 1;
      border: 1px solid #7c9cb779;
      border-radius: 26px;
      font-size: 33px;
      font-weight: 750;
      letter-spacing: -.075em;
      color: var(--accent);
      background: #14243980;
    }

    .monogram::after {
      content: "";
      position: absolute;
      top: 10px;
      right: 10px;
      width: 7px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0 0 20px;
      color: #f7faff;
      font-size: clamp(37px, 6.2vw, 68px);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 760;
    }

    .role {
      margin: 0;
      color: #c4d3e5;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.5;
    }

    nav {
      display: grid;
      align-content: center;
      gap: 13px;
      padding: clamp(22px, 4vw, 43px);
      background: #101c2d;
    }

    .resource {
      --tile: #223753;
      --icon: #bfdaff;
      min-width: 0;
      min-height: 84px;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      align-items: center;
      gap: 13px;
      padding: 13px;
      border: 1px solid #374961;
      border-radius: 16px;
      color: inherit;
      background: #19293e;
      text-decoration: none;
    }

    .resource--cv { --tile: #2b402a; --icon: var(--accent); }
    .resource--infographic { --tile: #3c3456; --icon: #e3d0ff; }

    a.resource { transition: background-color .18s, border-color .18s, transform .18s; }
    a.resource:hover { border-color: #a2cc79; background: #22354c; transform: translateY(-2px); }
    a.resource:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .icon {
      display: grid;
      place-items: center;
      width: 46px;
      aspect-ratio: 1;
      border-radius: 12px;
      color: var(--icon);
      background: var(--tile);
    }

    svg { display: block; width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .logo { fill: currentColor; stroke: none; }
    .arrow { width: 18px; height: 18px; margin-inline: 3px; color: #d5e3f5; }
    .name, .detail { display: block; overflow-wrap: anywhere; }
    .name { font-size: 17px; font-weight: 690; line-height: 1.25; }
    .detail { margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.3; }

    @media (max-width: 680px) {
      main { max-width: 460px; grid-template-columns: minmax(0, 1fr); border-radius: 25px; }
      header { min-height: 0; padding: 28px; gap: 27px; border-right: 0; border-bottom: 1px solid #34465c; }
      .monogram { width: 69px; border-radius: 19px; font-size: 25px; }
      h1 { margin-bottom: 12px; }
      nav { padding: 17px; gap: 10px; }
      .resource { min-height: 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      a.resource { transition: none; }
      a.resource:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="monogram" aria-hidden="true">MS</div>
      <div>
        <h1>Mahmoud<br>Ashraf Samak</h1>
        <p class="role">Digital Product Builder</p>
      </div>
    </header>
    <nav aria-label="Professional links">
      <a class="resource resource--cv" href="./assets/mahmoud-samak-cv.pdf" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h6"/></svg>
        </span>
        <span><span class="name">CV</span><span class="detail">View résumé (PDF)</span></span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M8 6h10v10"/></svg>
      </a>
      <a class="resource" href="https://www.linkedin.com/in/mahmoudashrafsamak/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg class="logo" viewBox="0 0 24 24"><path d="M6 8.6h3V19H6zm1.5-4.5a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM11 8.6h2.9V10c.5-.9 1.4-1.7 2.9-1.7 2.4 0 3.2 1.6 3.2 3.9V19h-3v-6.3c0-1.1-.2-2-1.4-2-1.1 0-1.6.8-1.6 2V19h-3z"/></svg>
        </span>
        <span><span class="name">LinkedIn</span><span class="detail">View profile</span></span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M8 6h10v10"/></svg>
      </a>
      <a class="resource resource--infographic" href="./assets/infographic.jpg" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 4v16h16M8 16v-4m5 4v-8m5 8V5"/></svg>
        </span>
        <span><span class="name">Infographic</span><span class="detail">Real-Time Fraud Detection System</span></span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M8 6h10v10"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
